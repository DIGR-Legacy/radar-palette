[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-palette"
description = "Advective interpolation and spectral (FFT) gridding for weather radar volumes"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Scott Collis", email = "scollis.acrf@gmail.com" },
]
maintainers = [
    { name = "Scott Collis", email = "scollis.acrf@gmail.com" },
]
keywords = [
    "weather radar",
    "interpolation",
    "gridding",
    "advection",
    "optical flow",
    "spectral methods",
    "py-art",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "arm_pyart>=2.0",
]

[project.optional-dependencies]
# Optical-flow motion estimation for radar_palette.advection.
advection = ["scikit-image>=0.22"]
# Non-uniform FFTs for radar_palette.gridding on non-uniform sweep geometries.
spectral = ["finufft>=2.2"]
all = ["radar-palette[advection,spectral]"]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.0",
    "sphinx-design>=0.5",
]
dev = [
    "radar-palette[all,test,docs]",
    "pre-commit>=3.6",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/DIGR-Legacy/radar-palette"
Source = "https://github.com/DIGR-Legacy/radar-palette"
Issues = "https://github.com/DIGR-Legacy/radar-palette/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar_palette = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/radar_palette/_version.py"
# No release tags yet; keep an explicit pre-1.0 fallback so builds from a
# tag-less clone or an sdist without .git still produce a usable version.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: test takes more than a few seconds",
    "network: test requires network access (e.g. ARM Live, NEXRAD on S3)",
]
filterwarnings = ["error::DeprecationWarning:radar_palette.*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "NPY",  # numpy-specific rules
    "D",    # pydocstyle
]
ignore = [
    "D105",  # magic method docstrings
    "D107",  # __init__ docstring (documented on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation: a descriptive test function or method name
# says more than a docstring restating it would. Docstrings are still used where
# a test encodes a non-obvious rationale, they are just not mandatory.
# D401 (imperative mood) is dropped for tests: a fixture docstring names the
# thing the fixture *is* ("a volume with known times"), which reads worse as an
# imperative than as a noun phrase.
"tests/**" = ["D100", "D101", "D102", "D103", "D401"]
"docs/conf.py" = ["D100", "A001"]

[tool.coverage.run]
source = ["radar_palette"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
